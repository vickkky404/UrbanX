<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanX App</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            display: flex;
            height: 90vh; /* Adjust as needed */
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background: #1f2933;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin-bottom: 15px;
        }
        .sidebar ul li a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .sidebar ul li a:hover, .sidebar ul li a.active {
            background: #374151;
            color: white;
        }
        .map-area {
            flex: 1;
            background: #e2e8f0;
            /* display: flex; align-items: center; justify-content: center; */
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .booking-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 340px;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        .booking-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            z-index: 10;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 12px 12px 40px; /* Space for icon */
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }
        .location-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #38bdf8;
            cursor: pointer;
            padding: 5px;
            font-size: 16px;
            transition: color 0.3s;
        }
        .location-btn:hover {
            color: #0ea5e9;
        }

        .ride-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none; /* Hidden by default */
            border: 1px solid #e2e8f0;
        }
        .ride-info p {
            margin: 5px 0;
            font-size: 14px;
            color: #475569;
            display: flex;
            justify-content: space-between;
        }
        .ride-info strong {
            color: #0f172a;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Success Overlay Styles */
        .success-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            margin-bottom: 20px;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(34, 197, 94, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .success-content h2 {
            color: #0f172a;
            margin: 0 0 10px;
            font-size: 28px;
        }

        .success-content p {
            color: #64748b;
            font-size: 16px;
            margin: 0;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0);}
            40% { color: #64748b; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0);}
            60% { text-shadow: .25em 0 0 #64748b, .5em 0 0 rgba(0,0,0,0);}
            80%, 100% { text-shadow: .25em 0 0 #64748b, .5em 0 0 #64748b;}
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <h2>UrbanX</h2>
        <div id="user-info" style="padding: 0 10px 20px; color: #38bdf8; font-size: 14px;"></div>
        <ul>
            <li><a href="#" class="active" onclick="showSection('book-ride', event)">Book a Ride</a></li>
            <li><a href="#" onclick="showSection('my-rides', event); loadRides();">My Rides</a></li>
            <li><a href="#">Wallet</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </div>
    <div class="map-area">
        <!-- Dashboard Sections -->

        <!-- Book Ride Section -->
        <div id="book-ride-section" class="dashboard-section" style="width: 100%; height: 100%; position: relative;">
            <!-- Real Map Container -->
            <div id="map"></div>
            <!-- Leaflet JS -->
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

            <div class="booking-panel">
                <h3><i class="fas fa-route" style="color: #38bdf8;"></i> Where to?</h3>
                <form id="bookingForm" autocomplete="off">
                    <div class="input-group">
                        <i class="fas fa-location-dot" style="color: #22c55e;"></i>
                        <input type="text" id="pickup" name="pickup" placeholder="Pickup Location" required onkeyup="searchLocation('pickup')" data-lat="" data-lon="">
                        <button type="button" class="location-btn" onclick="useCurrentLocation()" title="Use Current Location">
                            <i class="fas fa-crosshairs"></i>
                        </button>
                        <div id="pickup-results" class="search-results" style="display:none; position:absolute; width:100%; top: 100%; left:0; max-height:200px; overflow-y:auto; background:white; border:1px solid #ccc; z-index:1001; border-radius:0 0 6px 6px;"></div>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-map-pin" style="color: #ef4444;"></i>
                        <input type="text" id="dropoff" name="dropoff" placeholder="Dropoff Location" required onkeyup="searchLocation('dropoff')" data-lat="" data-lon="">
                        <div id="dropoff-results" class="search-results" style="display:none; position:absolute; width:100%; top: 100%; left:0; max-height:200px; overflow-y:auto; background:white; border:1px solid #ccc; z-index:1001; border-radius:0 0 6px 6px;"></div>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-car-side"></i>
                        <select id="vehicle_type" name="vehicle_type" onchange="calculatePrice()">
                            <option value="Cycle" data-rate="5">Cycle (Eco-Friendly)</option>
                            <option value="Bike" data-rate="10">Bike</option>
                            <option value="Auto" data-rate="15">Auto</option>
                            <option value="Cab" data-rate="25" selected>Cab</option>
                        </select>
                    </div>

                    <div id="ride-details" class="ride-info">
                        <p>Distance: <strong id="est-dist">0 km</strong></p>
                        <p>Time: <strong id="est-time">0 mins</strong></p>
                        <p>Est. Price: <strong id="est-price">₹0</strong></p>
                    </div>

                    <button type="submit" class="ride-btn">Request Ride</button>
                </form>
                <div id="booking-msg" style="margin-top: 10px; font-size: 14px;"></div>
            </div>

            <!-- Success Animation Overlay -->
            <div id="success-overlay" class="success-overlay">
                <div class="success-icon">✓</div>
                <div class="success-content">
                    <h2>Ride Requested!</h2>
                    <p>Searching for nearby captains<span class="loading-dots"></span></p>
                </div>
            </div>
        </div>

        <!-- My Rides Section -->
        <div id="my-rides-section" class="dashboard-section" style="display: none; width: 100%; padding: 40px; overflow-y: auto; background: #f4f6f8; box-sizing: border-box;">
            <h2 style="color: #0f172a; margin-top: 0;">My Rides</h2>
            <div id="rides-list" style="display: grid; gap: 20px;">
                <!-- Rides will be loaded here -->
                <p>Loading rides...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Auth Check
    const user = JSON.parse(localStorage.getItem('urbanx_user'));
    if (!user) {
        // alert('Please login to access the dashboard');
        window.location.href = 'Login/UserLogin.html';
    } else {
        document.getElementById('user-info').textContent = `Welcome, ${user.fullname}`;
    }

    function logout() {
        localStorage.removeItem('urbanx_user');
        window.location.href = 'index.html';
    }

    function showSection(sectionId, event) {
        if(event) event.preventDefault();

        // Hide all sections
        document.querySelectorAll('.dashboard-section').forEach(el => el.style.display = 'none');
        // Show target
        const target = document.getElementById(sectionId + '-section');
        if (target) {
            target.style.display = 'block';
        }

        // Update nav active state
        document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
        if(event && event.target) event.target.classList.add('active');

        // Resize map if visible
        if (sectionId === 'book-ride' && window.map) {
             setTimeout(() => { window.map.invalidateSize(); }, 100);
        }
    }

    let searchTimeout;
    let routeLine;
    let driverMarkers = [];

    // Haversine Distance Calculation
    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
        var R = 6371; // Radius of the earth in km
        var dLat = deg2rad(lat2-lat1);
        var dLon = deg2rad(lon2-lon1);
        var a =
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        var d = R * c; // Distance in km
        return d;
    }

    function deg2rad(deg) {
        return deg * (Math.PI/180)
    }

    function calculatePrice() {
        const pickupInput = document.getElementById('pickup');
        const dropoffInput = document.getElementById('dropoff');
        const detailsDiv = document.getElementById('ride-details');

        const lat1 = parseFloat(pickupInput.dataset.lat);
        const lon1 = parseFloat(pickupInput.dataset.lon);
        const lat2 = parseFloat(dropoffInput.dataset.lat);
        const lon2 = parseFloat(dropoffInput.dataset.lon);

        if (!isNaN(lat1) && !isNaN(lon1) && !isNaN(lat2) && !isNaN(lon2)) {
            const dist = getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2);
            // Add 20% for road vs straight line
            const roadDist = dist * 1.2;

            // Calculate Price
            const vehicleSelect = document.getElementById('vehicle_type');
            const rate = parseFloat(vehicleSelect.options[vehicleSelect.selectedIndex].dataset.rate);
            const price = Math.round(Math.max(20, roadDist * rate)); // Min fare 20

            // Est Time (avg speed 25km/h city)
            const time = Math.round((roadDist / 25) * 60);

            document.getElementById('est-dist').textContent = roadDist.toFixed(1) + ' km';
            document.getElementById('est-time').textContent = time + ' mins';
            document.getElementById('est-price').textContent = '₹' + price;

            detailsDiv.style.display = 'block';

            // Draw Route Line
            if (window.map) {
                if (routeLine) window.map.removeLayer(routeLine);
                routeLine = L.polyline([[lat1, lon1], [lat2, lon2]], {color: '#38bdf8', weight: 5, opacity: 0.7, dashArray: '10, 10'}).addTo(window.map);
                window.map.fitBounds(routeLine.getBounds(), {padding: [50, 50]});
            }
        } else {
            detailsDiv.style.display = 'none';
            if (routeLine && window.map) window.map.removeLayer(routeLine);
        }
    }

    async function useCurrentLocation() {
        const btn = document.querySelector('.location-btn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Reverse Geocode
                try {
                    const response = await fetch(`/api/geocode?lat=${lat}&lon=${lon}`);
                    const data = await response.json();

                    const input = document.getElementById('pickup');
                    input.dataset.lat = lat;
                    input.dataset.lon = lon;

                    if (data.display_name) {
                        input.value = data.display_name.split(',')[0]; // Simple name
                    } else {
                        input.value = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                    }

                    // Center map
                    if (window.map) {
                        window.map.setView([lat, lon], 15);
                        L.marker([lat, lon]).addTo(window.map).bindPopup('Your Location').openPopup();
                        // Add simulated drivers
                        addSimulatedDrivers(lat, lon);
                    }

                    calculatePrice();
                    btn.innerHTML = originalHtml;
                } catch (e) {
                    console.error(e);
                    alert('Could not get address');
                    btn.innerHTML = originalHtml;
                }
            }, () => {
                alert('Geolocation failed or denied');
                btn.innerHTML = originalHtml;
            });
        } else {
            alert('Geolocation is not supported by your browser');
            btn.innerHTML = originalHtml;
        }
    }

    function addSimulatedDrivers(lat, lon) {
        if (!window.map) return;

        // Remove existing
        driverMarkers.forEach(m => window.map.removeLayer(m));
        driverMarkers = [];

        const driverIcon = L.divIcon({
            html: '<i class="fas fa-car" style="color: #0f172a; font-size: 20px; text-shadow: 0 0 5px white;"></i>',
            className: 'driver-icon',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        // Add 3 drivers nearby
        for (let i = 0; i < 3; i++) {
            const dLat = lat + (Math.random() - 0.5) * 0.01;
            const dLon = lon + (Math.random() - 0.5) * 0.01;
            const marker = L.marker([dLat, dLon], {icon: driverIcon}).addTo(window.map);
            driverMarkers.push(marker);
        }
    }

    function searchLocation(type) {
        clearTimeout(searchTimeout);
        const input = document.getElementById(type);
        const resultsDiv = document.getElementById(type + '-results');
        const query = input.value;

        if (query.length < 3) {
            resultsDiv.style.display = 'none';
            return;
        }

        searchTimeout = setTimeout(async () => {
            try {
                const response = await fetch(`/api/geocode?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                resultsDiv.innerHTML = '';
                if (data.length > 0) {
                    data.forEach(place => {
                        const div = document.createElement('div');
                        div.style.padding = '10px';
                        div.style.cursor = 'pointer';
                        div.style.borderBottom = '1px solid #eee';
                        div.textContent = place.display_name;
                        div.onclick = () => {
                            input.value = place.display_name; // Simplified name
                            input.dataset.lat = place.lat; // Store coords
                            input.dataset.lon = place.lon;
                            resultsDiv.style.display = 'none';

                            // Optional: Center map on location
                            const lat = parseFloat(place.lat);
                            const lon = parseFloat(place.lon);
                            if (window.map) {
                                window.map.setView([lat, lon], 14);
                                L.marker([lat, lon]).addTo(window.map)
                                    .bindPopup(type.charAt(0).toUpperCase() + type.slice(1) + ': ' + place.display_name.split(',')[0])
                                    .openPopup();

                                if (type === 'pickup') {
                                    addSimulatedDrivers(lat, lon);
                                }
                            }
                            calculatePrice(); // Recalc on selection
                        };
                        div.onmouseover = () => div.style.backgroundColor = '#f0f9ff';
                        div.onmouseout = () => div.style.backgroundColor = 'white';
                        resultsDiv.appendChild(div);
                    });
                    resultsDiv.style.display = 'block';
                } else {
                    resultsDiv.style.display = 'none';
                }
            } catch (error) {
                console.error('Search error:', error);
            }
        }, 500); // 500ms debounce
    }

    // Close search results when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.input-group')) {
            document.querySelectorAll('.search-results').forEach(el => el.style.display = 'none');
        }
    });

    // Initialize Map
    function initMap() {
        // Default to a central location (e.g., Bangalore or New York) - using Bangalore coords
        // 12.9716° N, 77.5946° E
        const defaultLat = 12.9716;
        const defaultLng = 77.5946;

        window.map = L.map('map').setView([defaultLat, defaultLng], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(window.map);

        // Add a marker for user location simulation
        L.marker([defaultLat, defaultLng]).addTo(window.map)
            .bindPopup('You are here')
            .openPopup();

        // Add click handler to simulate picking location
        window.map.on('click', function(e) {
            // Simple logic to fill pickup/dropoff for demo
            const pickup = document.getElementById('pickup');
            const dropoff = document.getElementById('dropoff');

            const coordStr = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;

            if (!pickup.value) {
                pickup.value = coordStr;
                L.marker(e.latlng).addTo(window.map).bindPopup('Pickup').openPopup();
            } else if (!dropoff.value) {
                dropoff.value = coordStr;
                L.marker(e.latlng).addTo(window.map).bindPopup('Dropoff').openPopup();
            }
        });
    }

    // Call initMap when page loads (or section shows)
    // Since book-ride is default, call it after script loads?
    // Using simple timeout or window load
    window.addEventListener('load', initMap);

    // Booking Logic
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        const msg = document.getElementById('booking-msg');
        const pickup = document.getElementById('pickup').value;
        const dropoff = document.getElementById('dropoff').value;
        const vehicle_type = document.getElementById('vehicle_type').value;

        btn.disabled = true;
        btn.textContent = 'Requesting...';
        msg.textContent = '';
        msg.style.color = 'black';

        try {
            const formData = new FormData();
            formData.append('pickup', pickup);
            formData.append('dropoff', dropoff);
            formData.append('vehicle_type', vehicle_type);
            if (user) formData.append('user_id', user.id);

            const response = await fetch('/rides', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (response.ok) {
                // msg.textContent = 'Ride Requested Successfully! Captains are being notified.';
                // msg.style.color = 'green';

                // Show Success Overlay
                const overlay = document.getElementById('success-overlay');
                overlay.style.display = 'flex';

                this.reset();

                // Transition to My Rides after 3 seconds
                setTimeout(() => {
                    overlay.style.display = 'none';
                    showSection('my-rides', null);
                    loadRides();
                }, 3000);
            } else {
                msg.textContent = data.message || 'Error requesting ride.';
                msg.style.color = 'red';
            }
        } catch (err) {
            console.error(err);
            msg.textContent = 'Network error.';
            msg.style.color = 'red';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Request Ride';
        }
    });

    // Load Rides
    async function loadRides() {
        const list = document.getElementById('rides-list');
        list.innerHTML = '<p>Loading...</p>';

        try {
            const response = await fetch('/rides');
            const data = await response.json();

            if (data.status === 'ok') {
                // Filter rides for current user (Client-side filtering for prototype)
                const userRides = data.rides.filter(ride => ride.user_id == user.id);

                if (userRides.length === 0) {
                    list.innerHTML = '<p>No rides found.</p>';
                    return;
                }

                list.innerHTML = userRides.map(ride => `
                    <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #38bdf8;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <strong>Ride #${ride.id}</strong>
                            <span style="background: #f0f9ff; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-size: 12px; text-transform: uppercase; font-weight: bold;">${ride.status}</span>
                        </div>
                        <p style="margin: 5px 0; color: #64748b;"><strong>From:</strong> ${ride.pickup}</p>
                        <p style="margin: 5px 0; color: #64748b;"><strong>To:</strong> ${ride.dropoff}</p>
                        <p style="margin: 5px 0; color: #64748b;"><strong>Type:</strong> ${ride.vehicle_type}</p>
                        <small style="color: #94a3b8; display: block; margin-top: 10px;">${new Date(ride.created_at).toLocaleString()}</small>
                    </div>
                `).join('');
            }
        } catch (err) {
            console.error(err);
            list.innerHTML = '<p style="color: red;">Failed to load rides.</p>';
        }
    }
</script>

</body>
</html>
