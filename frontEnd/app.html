<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanX App</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .app-container {
            display: flex;
            height: 90vh; /* Adjust as needed */
        }
        .sidebar {
            width: 250px;
            background: #1f2933;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin-bottom: 15px;
        }
        .sidebar ul li a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .sidebar ul li a:hover, .sidebar ul li a.active {
            background: #374151;
            color: white;
        }
        .map-area {
            flex: 1;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            position: relative;
        }
        .booking-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
        }
        .booking-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .ride-btn {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .ride-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <h2>UrbanX</h2>
        <ul>
            <li><a href="#" class="active">Book a Ride</a></li>
            <li><a href="#">My Rides</a></li>
            <li><a href="#">Wallet</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="index.html">Logout</a></li>
        </ul>
    </div>
    <div class="map-area">
        <!-- Placeholder for Map -->
        <p>Map View Loading...</p>

        <div class="booking-panel">
            <h3>Where to?</h3>
            <div class="input-group">
                <input type="text" placeholder="Pickup Location">
            </div>
            <div class="input-group">
                <input type="text" placeholder="Dropoff Location">
            </div>
            <button class="ride-btn">Search Rides</button>
        </div>
    </div>
</div>

</body>
</html>
