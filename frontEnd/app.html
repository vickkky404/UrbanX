<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanX App</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        .app-container {
            display: flex;
            height: 90vh; /* Adjust as needed */
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background: #1f2933;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin-bottom: 15px;
        }
        .sidebar ul li a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .sidebar ul li a:hover, .sidebar ul li a.active {
            background: #374151;
            color: white;
        }
        .map-area {
            flex: 1;
            background: #e2e8f0;
            /* display: flex; align-items: center; justify-content: center; */
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .booking-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 320px;
            z-index: 1000; /* Ensure it's above the map */
            border: 1px solid rgba(255,255,255,0.2);
        }
        .booking-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1e293b;
            font-size: 20px;
            font-weight: 700;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .input-group select {
            background-color: white;
        }
        .ride-btn {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .ride-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        .search-results {
            display: none;
            position: absolute;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            z-index: 1001;
            border-radius: 0 0 6px 6px;
        }
        .search-results div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .search-results div:hover {
            background-color: #f0f9ff;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <h2>UrbanX</h2>
        <div id="user-info" style="padding: 0 10px 20px; color: #38bdf8; font-size: 14px;"></div>
        <ul>
            <li><a href="#" class="active" onclick="showSection('book-ride', event)">Book a Ride</a></li>
            <li><a href="#" onclick="showSection('my-rides', event); loadRides();">My Rides</a></li>
            <li><a href="#">Wallet</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </div>
    <div class="map-area">
        <!-- Dashboard Sections -->

        <!-- Book Ride Section -->
        <div id="book-ride-section" class="dashboard-section" style="width: 100%; height: 100%; position: relative;">
            <!-- Real Map Container -->
            <div id="map"></div>
            <!-- Leaflet JS -->
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

            <div class="booking-panel">
                <h3>Where to?</h3>
                <form id="bookingForm" autocomplete="off">
                    <div class="input-group" style="position: relative;">
                        <input type="text" id="pickup" name="pickup" placeholder="Pickup Location (e.g. Central Park)" required onkeyup="searchLocation('pickup')">
                        <div id="pickup-results" class="search-results" style="display:none; position:absolute; width:100%; max-height:200px; overflow-y:auto; background:white; border:1px solid #ccc; z-index:1001; border-radius:0 0 6px 6px;"></div>
                    </div>
                    <div class="input-group" style="position: relative;">
                        <input type="text" id="dropoff" name="dropoff" placeholder="Dropoff Location (e.g. Times Square)" required onkeyup="searchLocation('dropoff')">
                        <div id="dropoff-results" class="search-results" style="display:none; position:absolute; width:100%; max-height:200px; overflow-y:auto; background:white; border:1px solid #ccc; z-index:1001; border-radius:0 0 6px 6px;"></div>
                    </div>
                    <div class="input-group">
                        <select id="vehicle_type" name="vehicle_type">
                            <option value="Cycle">Cycle (Eco-Friendly)</option>
                            <option value="Bike">Bike</option>
                            <option value="Auto">Auto</option>
                            <option value="Cab" selected>Cab</option>
                        </select>
                    </div>
                    <button type="submit" class="ride-btn">Request Ride</button>
                </form>
                <div id="booking-msg" style="margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>

        <!-- My Rides Section -->
        <div id="my-rides-section" class="dashboard-section" style="display: none; width: 100%; padding: 40px; overflow-y: auto; background: #f4f6f8; box-sizing: border-box;">
            <h2 style="color: #0f172a; margin-top: 0;">My Rides</h2>
            <div id="rides-list" style="display: grid; gap: 20px;">
                <!-- Rides will be loaded here -->
                <p>Loading rides...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Auth Check
    const user = JSON.parse(localStorage.getItem('urbanx_user'));
    if (!user) {
        // alert('Please login to access the dashboard');
        window.location.href = 'Login/UserLogin.html';
    } else {
        document.getElementById('user-info').textContent = `Welcome, ${user.fullname}`;
    }

    function logout() {
        localStorage.removeItem('urbanx_user');
        window.location.href = 'index.html';
    }

    function showSection(sectionId, event) {
        if(event) event.preventDefault();

        // Hide all sections
        document.querySelectorAll('.dashboard-section').forEach(el => el.style.display = 'none');
        // Show target
        const target = document.getElementById(sectionId + '-section');
        if (target) {
            target.style.display = 'block';
        }

        // Update nav active state
        document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
        if(event && event.target) event.target.classList.add('active');

        // Resize map if visible
        if (sectionId === 'book-ride' && window.map) {
             setTimeout(() => { window.map.invalidateSize(); }, 100);
        }
    }

    let searchTimeout;

    function searchLocation(type) {
        clearTimeout(searchTimeout);
        const input = document.getElementById(type);
        const resultsDiv = document.getElementById(type + '-results');
        const query = input.value;

        if (query.length < 3) {
            resultsDiv.style.display = 'none';
            return;
        }

        searchTimeout = setTimeout(async () => {
            try {
                const response = await fetch(`/api/geocode?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                resultsDiv.innerHTML = '';
                if (data.length > 0) {
                    data.forEach(place => {
                        const div = document.createElement('div');
                        div.style.padding = '10px';
                        div.style.cursor = 'pointer';
                        div.style.borderBottom = '1px solid #eee';
                        div.textContent = place.display_name;
                        div.onclick = () => {
                            input.value = place.display_name; // Simplified name
                            resultsDiv.style.display = 'none';

                            // Optional: Center map on location
                            const lat = parseFloat(place.lat);
                            const lon = parseFloat(place.lon);
                            if (window.map) {
                                window.map.setView([lat, lon], 14);
                                L.marker([lat, lon]).addTo(window.map)
                                    .bindPopup(type.charAt(0).toUpperCase() + type.slice(1) + ': ' + place.display_name.split(',')[0])
                                    .openPopup();
                            }
                        };
                        div.onmouseover = () => div.style.backgroundColor = '#f0f9ff';
                        div.onmouseout = () => div.style.backgroundColor = 'white';
                        resultsDiv.appendChild(div);
                    });
                    resultsDiv.style.display = 'block';
                } else {
                    resultsDiv.style.display = 'none';
                }
            } catch (error) {
                console.error('Search error:', error);
            }
        }, 500); // 500ms debounce
    }

    // Close search results when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.input-group')) {
            document.querySelectorAll('.search-results').forEach(el => el.style.display = 'none');
        }
    });

    // Initialize Map
    function initMap() {
        // Default to a central location (e.g., Bangalore or New York) - using Bangalore coords
        // 12.9716° N, 77.5946° E
        const defaultLat = 12.9716;
        const defaultLng = 77.5946;

        window.map = L.map('map').setView([defaultLat, defaultLng], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(window.map);

        // Add a marker for user location simulation
        L.marker([defaultLat, defaultLng]).addTo(window.map)
            .bindPopup('You are here')
            .openPopup();

        // Add click handler to simulate picking location
        window.map.on('click', function(e) {
            // Simple logic to fill pickup/dropoff for demo
            const pickup = document.getElementById('pickup');
            const dropoff = document.getElementById('dropoff');

            const coordStr = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;

            if (!pickup.value) {
                pickup.value = coordStr;
                L.marker(e.latlng).addTo(window.map).bindPopup('Pickup').openPopup();
            } else if (!dropoff.value) {
                dropoff.value = coordStr;
                L.marker(e.latlng).addTo(window.map).bindPopup('Dropoff').openPopup();
            }
        });
    }

    // Call initMap when page loads (or section shows)
    // Since book-ride is default, call it after script loads?
    // Using simple timeout or window load
    window.addEventListener('load', initMap);

    // Booking Logic
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        const msg = document.getElementById('booking-msg');
        const pickup = document.getElementById('pickup').value;
        const dropoff = document.getElementById('dropoff').value;
        const vehicle_type = document.getElementById('vehicle_type').value;

        btn.disabled = true;
        btn.textContent = 'Requesting...';
        msg.textContent = '';
        msg.style.color = 'black';

        try {
            const formData = new FormData();
            formData.append('pickup', pickup);
            formData.append('dropoff', dropoff);
            formData.append('vehicle_type', vehicle_type);
            if (user) formData.append('user_id', user.id);

            const response = await fetch('/rides', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (response.ok) {
                msg.textContent = 'Ride Requested Successfully! Captains are being notified.';
                msg.style.color = 'green';
                this.reset();
                // Optionally switch to my rides
                // setTimeout(() => { showSection('my-rides', null); loadRides(); }, 1500);
            } else {
                msg.textContent = data.message || 'Error requesting ride.';
                msg.style.color = 'red';
            }
        } catch (err) {
            console.error(err);
            msg.textContent = 'Network error.';
            msg.style.color = 'red';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Request Ride';
        }
    });

    // Load Rides
    async function loadRides() {
        const list = document.getElementById('rides-list');
        list.innerHTML = '<p>Loading...</p>';

        try {
            const response = await fetch('/rides');
            const data = await response.json();

            if (data.status === 'ok') {
                // Filter rides for current user (Client-side filtering for prototype)
                const userRides = data.rides.filter(ride => ride.user_id == user.id);

                if (userRides.length === 0) {
                    list.innerHTML = '<p>No rides found.</p>';
                    return;
                }

                list.innerHTML = userRides.map(ride => `
                    <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #38bdf8;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <strong>Ride #${ride.id}</strong>
                            <span style="background: #f0f9ff; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-size: 12px; text-transform: uppercase; font-weight: bold;">${ride.status}</span>
                        </div>
                        <p style="margin: 5px 0; color: #64748b;"><strong>From:</strong> ${ride.pickup}</p>
                        <p style="margin: 5px 0; color: #64748b;"><strong>To:</strong> ${ride.dropoff}</p>
                        <p style="margin: 5px 0; color: #64748b;"><strong>Type:</strong> ${ride.vehicle_type}</p>
                        <small style="color: #94a3b8; display: block; margin-top: 10px;">${new Date(ride.created_at).toLocaleString()}</small>
                    </div>
                `).join('');
            }
        } catch (err) {
            console.error(err);
            list.innerHTML = '<p style="color: red;">Failed to load rides.</p>';
        }
    }
</script>

</body>
</html>
