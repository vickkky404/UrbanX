<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - User Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<header>
    <h1>UrbanX</h1>
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../about.html">About Us</a></li>
            <li><a href="../exploreOurServices.html">Services</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="../app.html">Launch App</a></li>
            <li><a href="UserLogin.html" class="active">Login/Signup</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="login-container">
        <h2>User Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username/Email:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
            <div id="error-msg" style="color: red; margin-top: 10px; display: none;"></div>

            <div class="login-links">
                <p>New to UrbanX? <a href="UserSignup.html">Sign Up here</a></p>
                <p>Are you a Captain? <a href="CaptainLogin.html">Login as Captain</a></p>
            </div>
        </form>
    </div>
</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const errorMsg = document.getElementById('error-msg');

        try {
            const response = await fetch('/user/login', {
                method: 'POST',
                body: formData
            });

            // Check content type to ensure it is JSON
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await response.text();
                throw new Error("Server returned non-JSON response: " + text.substring(0, 100) + "...");
            }

            const data = await response.json();

            if (response.ok) {
                // Store user info
                localStorage.setItem('urbanx_user', JSON.stringify({
                    id: data.user_id,
                    fullname: data.fullname
                }));
                // Redirect to dashboard
                window.location.href = '../app.html';
            } else {
                errorMsg.textContent = data.message || 'Login failed';
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            console.error('Error:', error);
            errorMsg.textContent = 'An error occurred: ' + error.message;
            errorMsg.style.display = 'block';
        }
    });
</script>

<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
</body>
</html>
