<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - User Login</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
<header class="auth-header">
    <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">UX</div>
        <div class="auth-name">UrbanX</div>
    </div>
    <div class="auth-actions" aria-label="Authentication navigation">
        <a class="auth-tab active" href="UserLogin.html">Login</a>
        <a class="auth-tab" href="UserSignup.html">Signup</a>
    </div>
</header>

<main class="auth-main">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-panel">
                <div class="auth-panel-title">Sign in to your account</div>
                <form id="loginForm">
                    <div class="auth-row">
                        <label class="auth-label" for="username">Email</label>
                        <input class="auth-input" type="text" id="username" name="username" placeholder="Enter your email" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="password">Password</label>
                        <input class="auth-input" type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="auth-submit">Sign In</button>
                    <div id="error-msg" class="auth-message" style="display: none;"></div>
                    <div class="login-links">
                        <p>New to UrbanX? <a href="UserSignup.html">Create an account</a></p>
                    </div>
                </form>
            </div>
        </div>
        <div class="captain-promo-box">
            <p>Want to drive & earn money?</p>
            <a href="CaptainSignup.html" class="captain-link-btn"><i class="fas fa-car"></i> Become a Captain</a>
        </div>
    </div>
</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const errorMsg = document.getElementById('error-msg');

        try {
            const response = await fetch('/user/login', {
                method: 'POST',
                body: formData
            });

            // Check content type to ensure it is JSON
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await response.text();
                throw new Error("Server returned non-JSON response: " + text.substring(0, 100) + "...");
            }

            const data = await response.json();

            if (response.ok) {
                // Store user info
                localStorage.setItem('urbanx_user', JSON.stringify({
                    id: data.user_id,
                    fullname: data.fullname
                }));
                // Redirect to dashboard
                window.location.href = '../app.html';
            } else {
                errorMsg.textContent = data.message || 'Login failed';
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            console.error('Error:', error);
            errorMsg.textContent = 'An error occurred: ' + error.message;
            errorMsg.style.display = 'block';
        }
    });
</script>

<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
</body>
</html>
