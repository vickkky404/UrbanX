<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - User Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<header>
    <h1>UrbanX</h1>
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../about.html">About Us</a></li>
            <li><a href="../exploreOurServices.html">Services</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="UserLogin.html" class="active">Login/Signup</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="login-container">
        <h2>User Login</h2>
        <form action="/user/login" method="post">
            <div class="form-group">
                <label for="username">Username/Email:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>

            <div class="login-links">
                <p>New to UrbanX? <a href="UserSignup.html">Sign Up here</a></p>
                <p>Are you a Captain? <a href="CaptainLogin.html">Login as Captain</a></p>
            </div>
        </form>
    </div>
</main>

<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
</body>
</html>
