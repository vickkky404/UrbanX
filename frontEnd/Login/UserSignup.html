<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - User Signup</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<header>
    <h1>UrbanX</h1>
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../about.html">About Us</a></li>
            <li><a href="../exploreOurServices.html">Services</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="UserLogin.html">Login/Signup</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="login-container">
        <h2>Create an Account</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn-submit">Sign Up</button>
            <div id="msg" style="margin-top: 10px; display: none;"></div>

            <p class="switch-auth">
                Already have an account? <a href="UserLogin.html">Login here</a>
            </p>
        </form>
    </div>
</main>
<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msg = document.getElementById('msg');
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm_password').value;

        if (pass !== confirmPass) {
            msg.textContent = 'Passwords do not match.';
            msg.style.color = 'red';
            msg.style.display = 'block';
            return;
        }

        const formData = new FormData(this);
        try {
            const response = await fetch('/user/signup', {
                method: 'POST',
                body: formData
            });

            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await response.text();
                // console.error("Non-JSON response:", text);
                throw new Error("Server Error: " + response.status + " " + response.statusText);
            }

            const data = await response.json();

            if (response.ok) {
                msg.textContent = 'Signup Successful! Redirecting to Login...';
                msg.style.color = 'green';
                msg.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'UserLogin.html';
                }, 2000);
            } else {
                msg.textContent = data.message || 'Signup failed.';
                msg.style.color = 'red';
                msg.style.display = 'block';
            }
        } catch (error) {
            console.error('Error:', error);
            msg.textContent = 'An error occurred: ' + error.message;
            msg.style.color = 'red';
            msg.style.display = 'block';
        }
    });
</script>
</body>
</html>
