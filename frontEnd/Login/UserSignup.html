<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - User Signup</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
<header class="auth-header">
    <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">UX</div>
        <div class="auth-name">UrbanX</div>
    </div>
    <div class="auth-actions" aria-label="Authentication navigation">
        <a class="auth-tab" href="UserLogin.html">Login</a>
        <a class="auth-tab active" href="UserSignup.html">Signup</a>
    </div>
</header>

<main class="auth-main">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-panel">
                <div class="auth-panel-title">Create your account</div>
                <form id="signupForm">
                    <div class="auth-row">
                        <label class="auth-label" for="fullname">Full Name</label>
                        <input class="auth-input" type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="email">Email</label>
                        <input class="auth-input" type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="password">Password</label>
                        <input class="auth-input" type="password" id="password" name="password" placeholder="Min. 8 characters" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="confirm_password">Confirm Password</label>
                        <input class="auth-input" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="auth-submit">Create Account</button>
                    <div id="msg" class="auth-message" style="display: none;"></div>
                    <p class="switch-auth">Already have an account? <a href="UserLogin.html">Sign in</a></p>
                </form>
            </div>
        </div>
        <div class="captain-promo-box">
            <p>Want to drive & earn money?</p>
            <a href="CaptainSignup.html" class="captain-link-btn"><i class="fas fa-car"></i> Become a Captain</a>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msg = document.getElementById('msg');
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm_password').value;

        if (pass !== confirmPass) {
            msg.textContent = 'Passwords do not match.';
            msg.style.color = 'red';
            msg.style.display = 'block';
            return;
        }

        const formData = new FormData(this);
        try {
            const response = await fetch('/user/signup', {
                method: 'POST',
                body: formData
            });

            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await response.text();
                // console.error("Non-JSON response:", text);
                throw new Error("Server Error: " + response.status + " " + response.statusText);
            }

            const data = await response.json();

            if (response.ok) {
                msg.textContent = 'Signup Successful! Redirecting to Login...';
                msg.style.color = 'green';
                msg.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'UserLogin.html';
                }, 2000);
            } else {
                msg.textContent = data.message || 'Signup failed.';
                msg.style.color = 'red';
                msg.style.display = 'block';
            }
        } catch (error) {
            console.error('Error:', error);
            msg.textContent = 'An error occurred: ' + error.message;
            msg.style.color = 'red';
            msg.style.display = 'block';
        }
    });
</script>
</body>
</html>
