<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - Captain Signup</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-page">
<header class="auth-header">
    <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">UX</div>
        <div class="auth-name">UrbanX</div>
    </div>
    <div class="auth-actions" aria-label="Authentication navigation">
        <a class="auth-tab" href="CaptainLogin.html">Login</a>
        <a class="auth-tab active" href="CaptainSignup.html">Signup</a>
    </div>
</header>
<main class="auth-main">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-panel">
                <div class="auth-panel-title">Become a Captain</div>
                <form id="signupForm">
                    <div class="auth-row">
                        <label class="auth-label" for="fullname">Full Name</label>
                        <input class="auth-input" type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="email">Email</label>
                        <input class="auth-input" type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="age">Age</label>
                        <input class="auth-input" type="number" id="age" name="age" min="18" placeholder="Must be 18+" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="vehicle_type">Vehicle Type</label>
                        <select class="auth-input" id="vehicle_type" name="vehicle_type">
                            <option value="" disabled selected>Select your vehicle</option>
                            <option value="bike">Bike</option>
                            <option value="auto">Auto</option>
                            <option value="cab">Cab</option>
                        </select>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="password">Password</label>
                        <input class="auth-input" type="password" id="password" name="password" placeholder="Min. 8 characters" required>
                    </div>
                    <button type="submit" class="auth-submit">Create Account</button>
                    <div id="message" class="auth-message"></div>
                    <p class="switch-auth">Already a Captain? <a href="CaptainLogin.html">Sign in</a></p>
                </form>
            </div>
        </div>
    </div>
</main>
<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/captain/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const messageDiv = document.getElementById('message');

            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.textContent = 'Registration successful! Redirecting to login...';
                setTimeout(() => {
                    window.location.href = 'CaptainLogin.html';
                }, 1500);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = result.message || 'Registration failed';
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('message').textContent = 'An error occurred. Please try again.';
        }
    });
</script>
<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
</body>
</html>
