<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - Captain Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-page">
<header class="auth-header">
    <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">UX</div>
        <div class="auth-name">Urbanex</div>
    </div>
    <div class="auth-actions" aria-label="Authentication navigation">
        <a class="auth-tab active" href="CaptainLogin.html">Login</a>
        <a class="auth-tab" href="CaptainSignup.html">Signup</a>
    </div>
</header>
<main class="auth-main">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-panel">
                <div class="auth-panel-title">Login (Captain)</div>
                <form id="loginForm">
                    <div class="auth-row">
                        <label class="auth-label" for="email">Email =</label>
                        <input class="auth-input" type="email" id="email" name="email" required>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="vehicle_type">Vehicle Type =</label>
                        <select class="auth-input" id="vehicle_type" name="vehicle_type" required>
                            <option value="" disabled selected>Select Vehicle</option>
                            <option value="bike">Bike</option>
                            <option value="auto">Auto</option>
                            <option value="cab">Cab</option>
                        </select>
                    </div>
                    <div class="auth-row">
                        <label class="auth-label" for="password">Password =</label>
                        <input class="auth-input" type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="auth-submit">submit</button>
                    <div id="message" class="auth-message"></div>
                    <div class="login-links">
                        <p>Want to join us? <a href="CaptainSignup.html">Sign Up as Captain</a></p>
                        <p>Not a Captain? <a href="UserLogin.html">User Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/captain/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const messageDiv = document.getElementById('message');

            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.textContent = 'Login successful! Redirecting...';
                // Store token or user info if needed
                localStorage.setItem('userType', 'captain');
                localStorage.setItem('urbx_captain', JSON.stringify(result.captain));

                setTimeout(() => {
                    window.location.href = '../captain_dashboard.html';
                }, 1000);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = result.message || 'Login failed';
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('message').textContent = 'An error occurred. Please try again.';
        }
    });
</script>
<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
</body>
</html>
