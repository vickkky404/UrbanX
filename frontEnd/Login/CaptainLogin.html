<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - Captain Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<header>
    <h1>UrbanX Captain</h1>
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../about.html">About Us</a></li>
            <li><a href="../exploreOurServices.html">Services</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="CaptainLogin.html" class="active">Login</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="login-container captain-login">
        <h2>Captain Login</h2>
        <form action="/captain/login" method="post">
            <div class="form-group">
                <label for="username">Username/Email:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>

            <div class="login-links">
                <p>Want to join us? <a href="CaptainSignup.html">Sign Up as Captain</a></p>
                <p>Not a Captain? <a href="UserLogin.html">User Login</a></p>
            </div>
        </form>
    </div>
</main>
<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
</body>
</html>
