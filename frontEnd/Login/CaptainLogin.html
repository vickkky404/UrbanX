<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanX - Captain Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<header>
    <h1>UrbanX Captain</h1>
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../about.html">About Us</a></li>
            <li><a href="../exploreOurServices.html">Services</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="../app.html">Launch App</a></li>
            <li><a href="CaptainLogin.html" class="active">Login</a></li>
        </ul>
    </nav>
</header>
<main>
    <div class="login-container captain-login">
        <h2>Captain Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>

            <div id="message" style="margin-top: 10px; color: red;"></div>

            <div class="login-links">
                <p>Want to join us? <a href="CaptainSignup.html">Sign Up as Captain</a></p>
                <p>Not a Captain? <a href="UserLogin.html">User Login</a></p>
            </div>
        </form>
    </div>
</main>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/captain/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const messageDiv = document.getElementById('message');

            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.textContent = 'Login successful! Redirecting...';
                // Store token or user info if needed
                localStorage.setItem('userType', 'captain');
                setTimeout(() => {
                    window.location.href = '../app.html';
                }, 1000);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = result.message || 'Login failed';
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('message').textContent = 'An error occurred. Please try again.';
        }
    });
</script>
    </div>
</main>
<footer>
    <p>&copy; 2026 UrbanX. All rights reserved.</p>
</footer>
</body>
</html>
